<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karakter Sayfası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../assets/stil.css">
<link rel="stylesheet" href="../assets/karakter.css">
</head>
<body>
<div class="sheet">
  <div class="topbar">
    <a href="../">← Kuyudan Yukarı</a>
    <label for="pick" hidden>Karakter</label>
    <select id="pick"></select>
    <label class="gm" style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="zar3d" checked> 3D zar</label>
    <label class="gm" style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="zarses" checked> Ses</label>
    <div class="mode" id="mode" role="group" aria-label="Zar modu">
      <button class="btn" data-mode="dis" title="İki d20, düşüğü">Disadvantage</button>
      <button class="btn on" data-mode="norm">Normal</button>
      <button class="btn" data-mode="adv" title="İki d20, yükseği">Advantage</button>
    </div>
  </div>
  <div id="root"><p class="empty">Karakterler yükleniyor…</p></div>
  <p class="foot">HP, slot ve condition'lar bu tarayıcıda saklanır. Owlbear'da ise odadaki herkesle paylaşılır.</p>
</div>
<div class="log" id="log" hidden><div class="ttl"></div><div class="res"></div><div class="brk"></div><div class="hist"></div></div>
<script src="../assets/karakter.js"></script>
<script src="../assets/zar-ses.js"></script>
<script>
(function () {
  var key = function (id) { return "ky-durum-" + id; };
  var store = {
    load: function (id) { try { return Promise.resolve(JSON.parse(localStorage.getItem(key(id)))); } catch (e) { return Promise.resolve(null); } },
    save: function (id, s) { try { localStorage.setItem(key(id), JSON.stringify(s)); } catch (e) {} },
    onChange: function (cb) { window.addEventListener("storage", function (e) { if (e.key && e.key.indexOf("ky-durum-") === 0) { try { cb(e.key.slice(9), JSON.parse(e.newValue)); } catch (x) {} } }); }
  };
  var goster = ZarKutusu(document.getElementById("log"));
  var z3 = document.getElementById("zar3d");
  try { z3.checked = localStorage.getItem("ky-zar3d") !== "0"; } catch (e) {}
  z3.addEventListener("change", function () { try { localStorage.setItem("ky-zar3d", z3.checked ? "1" : "0"); } catch (e) {} });
  var zs = document.getElementById("zarses");
  try { zs.checked = localStorage.getItem("ky-zar-ses") !== "0"; } catch (e) {}
  zs.addEventListener("change", function () { try { localStorage.setItem("ky-zar-ses", zs.checked ? "1" : "0"); } catch (e) {} });
  var ses = ZarSesi("../assets/");
  var katman = null;
  function sahne(r) {
    if (!z3.checked || !r.zar) { goster(r); return; }
    if (zs.checked) ses.cal(r.zar, r.sinif);
    if (katman) katman.remove();
    katman = document.createElement("div");
    katman.style.cssText = "position:fixed;inset:0;z-index:50;pointer-events:none";
    document.body.appendChild(katman);
    var k = katman;
    import("../assets/zar3d.js").then(function (m) { return m.zarAt(k, r.zar, r.sinif || "normal", false); })
      .catch(function (e) { console.warn("3D zar:", e); })
      .then(function () { goster(r); setTimeout(function () { if (k === katman) { k.remove(); katman = null; } }, 1300); });
  }
  var ks = KarakterSayfasi({
    root: document.getElementById("root"), pick: document.getElementById("pick"), mode: document.getElementById("mode"),
    base: "../", store: store, onRoll: sahne,
    onSelect: function (id, c) { document.title = c.ad + " · Karakter Sayfası"; if (location.hash.slice(1) !== String(id)) history.replaceState(null, "", "#" + id); }
  });
  ks.list().then(function (items) { var want = ks.fill(items, location.hash.slice(1)); if (want) ks.open(want); })
    .catch(function () { document.getElementById("root").innerHTML = '<p class="empty">Karakter listesi yüklenemedi.</p>'; });
})();
</script>
</body>
</html>
