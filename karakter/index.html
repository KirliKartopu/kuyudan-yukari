<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karakter Sayfası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../assets/stil.css">
<style>
  body{font-size:16px}
  .sheet{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
  .topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .topbar a{font-size:14px}
  .topbar select{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
  .who{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:14px}
  .who img{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--surface)}
  .who h1{font-size:30px;margin:0;line-height:1.1}
  .who p{margin:2px 0 0;color:var(--muted);font-size:15px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
  .box h2{font-size:18px;margin:0 0 8px;font-weight:500;color:var(--brass)}
  .span2{grid-column:1/-1}
  .vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
  .vital{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--ground);text-align:center}
  .vital b{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
  .vital small{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  button.vital{font:inherit;color:var(--ink);cursor:pointer}
  button.vital:hover,button.vital:focus-visible{border-color:var(--accent);outline:none}
  .hp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  .hp-num{font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums}
  .hp-num small{font-size:16px;color:var(--muted)}
  .hpbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;grid-column:1/-1}
  .hpbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
  .hp-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;grid-column:1/-1}
  .hp-ctl input{width:70px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink)}
  .btn{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink);cursor:pointer}
  .btn:hover,.btn:focus-visible{border-color:var(--accent);outline:none}
  .btn.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
  .abil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .ab{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;background:var(--ground)}
  .ab .nm{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
  .ab button{font:inherit;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;display:block;width:100%}
  .ab .md{font-family:var(--mono);font-size:24px;line-height:1.2}
  .ab .sc{font-size:13px;color:var(--muted)}
  .ab .sv{margin-top:6px;font-size:13px;border-top:1px dashed var(--line);padding-top:4px}
  .ab .sv.prof{color:var(--accent);font-weight:700}
  ul.rows{list-style:none;margin:0;padding:0}
  ul.rows li{max-width:none}
  ul.rows button{width:100%;display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:5px 2px;color:var(--ink);cursor:pointer}
  ul.rows button:hover,ul.rows button:focus-visible{background:var(--accent-soft);outline:none}
  .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
  .dot.p1{background:var(--muted)}
  .dot.p2{background:var(--accent);border-color:var(--accent)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .ab-tag{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
  .atk{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}
  .atk .n{font-weight:700}
  .atk .meta{grid-column:1/-1;font-size:13px;color:var(--muted)}
  .slots{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .slots label{display:flex;gap:4px;align-items:center;font-size:14px}
  .slots input{accent-color:var(--accent);width:16px;height:16px}
  .spl{font-size:15px;margin:0 0 6px}
  .spl b{font-family:var(--mono);font-size:12px;color:var(--brass);margin-right:6px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .conds .btn{font-size:13px;padding:4px 8px}
  .feat{font-size:15px;margin:0 0 4px}
  .feat small{color:var(--muted)}
  .mode{display:flex;gap:4px}
  /* zar kutusu */
  .log{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(520px,calc(100% - 24px));background:var(--surface);border:1px solid var(--accent);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
  .log .ttl{font-size:14px;color:var(--muted)}
  .log .res{font-family:var(--mono);font-size:34px;font-weight:500;line-height:1}
  .log .res.crit{color:var(--accent)}
  .log .res.fail{color:var(--warn)}
  .log .brk{grid-column:1/-1;font-family:var(--mono);font-size:13px;color:var(--muted)}
  .log .hist{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:4px;max-height:3.6em;overflow:auto}
  .empty{padding:40px 0;color:var(--muted)}
  .foot{font-size:13px;color:var(--muted);margin-top:14px}
  @media (max-width:720px){ .grid{grid-template-columns:1fr} .who h1{font-size:24px} }
</style>
</head>
<body>
<div class="sheet">
  <div class="topbar">
    <a href="../">← Kuyudan Yukarı</a>
    <label for="pick" hidden>Karakter</label>
    <select id="pick"></select>
    <div class="mode" role="group" aria-label="Zar modu">
      <button class="btn" data-mode="dis" title="İki d20, düşüğü">Disadvantage</button>
      <button class="btn on" data-mode="norm">Normal</button>
      <button class="btn" data-mode="adv" title="İki d20, yükseği">Advantage</button>
    </div>
  </div>
  <div id="root"><p class="empty">Karakterler yükleniyor…</p></div>
  <p class="foot" id="foot"></p>
</div>
<div class="log" id="log" hidden>
  <div class="ttl" id="log-ttl"></div><div class="res" id="log-res"></div>
  <div class="brk" id="log-brk"></div>
  <div class="hist" id="log-hist"></div>
</div>

<script>
(function(){
  var AB = {str:"Strength",dex:"Dexterity",con:"Constitution",int:"Intelligence",wis:"Wisdom",cha:"Charisma"};
  var CONDS = ["Blinded","Charmed","Deafened","Frightened","Grappled","Incapacitated","Invisible","Paralyzed","Petrified","Poisoned","Prone","Restrained","Stunned","Unconscious"];
  var root = document.getElementById('root'), pick = document.getElementById('pick');
  var mode = 'norm', C = null, S = null, hist = [];
  var sgn = function(n){ return (n>=0?'+':'')+n; };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };

  // --- kalıcı durum (şimdilik bu tarayıcıda; Owlbear'da odaya taşınacak)
  function load(id){ try { return JSON.parse(localStorage.getItem('ky-durum-'+id)) || null; } catch(e){ return null; } }
  function save(){ if(!C) return; try { localStorage.setItem('ky-durum-'+C.id, JSON.stringify(S)); } catch(e){} }
  function fresh(){ return {hp:C.hp_max, temp:0, slots:{}, conds:[], insp:false, ds:{s:0,f:0}}; }

  // --- zar
  function d(n){ return 1+Math.floor(Math.random()*n); }
  function show(title, total, breakdown, cls){
    var log=document.getElementById('log');
    document.getElementById('log-ttl').textContent=title;
    var r=document.getElementById('log-res'); r.textContent=total; r.className='res'+(cls?' '+cls:'');
    document.getElementById('log-brk').textContent=breakdown;
    hist.unshift(title+': '+total); hist=hist.slice(0,8);
    document.getElementById('log-hist').textContent=hist.slice(1).join(' · ');
    log.hidden=false;
  }
  function d20(title, bonus, isAttack){
    var a=d(20), b=d(20), use=a, note='d20 ('+a+')';
    if(mode==='adv'){ use=Math.max(a,b); note='Advantage: d20 ('+a+', '+b+')'; }
    if(mode==='dis'){ use=Math.min(a,b); note='Disadvantage: d20 ('+a+', '+b+')'; }
    var cls = isAttack && use===20 ? 'crit' : isAttack && use===1 ? 'fail' : '';
    var extra = isAttack && use===20 ? ' · KRİTİK! Hasar zarlarını iki kez at' : isAttack && use===1 ? ' · Iska' : '';
    show(title, use+bonus, note+' '+sgn(bonus)+extra, cls);
    return use;
  }
  function dmg(title, expr, crit){
    var m=String(expr).match(/^(\d+)d(\d+)([+-]\d+)?$/); if(!m){ show(title, expr, ''); return; }
    var n=+m[1]*(crit?2:1), f=+m[2], k=+(m[3]||0), rolls=[], t=0;
    for(var i=0;i<n;i++){ var r=d(f); rolls.push(r); t+=r; }
    show(title+(crit?' (kritik)':''), t+k, n+'d'+f+' ('+rolls.join(', ')+')'+(k?' '+sgn(k):''));
  }

  // --- çizim
  function render(){
    var c=C, cls=c.siniflar.map(function(x){ return x.ad+' '+x.seviye+(x.subclass?' · '+x.subclass:''); }).join(' / ');
    var h='';
    h+='<div class="who">'+(c.avatar?'<img alt="" src="'+esc(c.avatar)+'">':'<span></span>')+
       '<div><h1>'+esc(c.ad)+'</h1><p>'+esc(c.tur)+' · '+esc(cls)+(c.background?' · '+esc(c.background):'')+(c.oyuncu?' · <i>'+esc(c.oyuncu)+'</i>':'')+'</p></div></div>';
    h+='<div class="grid">';
    // HP
    var pct=Math.max(0,Math.min(100,Math.round(100*S.hp/c.hp_max)));
    h+='<section class="box"><h2>Hit Points</h2><div class="hp">'+
       '<div class="hp-num">'+S.hp+' <small>/ '+c.hp_max+(S.temp?' · temp '+S.temp:'')+'</small></div>'+
       '<button class="btn '+(S.insp?'on':'')+'" id="insp" title="Heroic Inspiration: bir zarı yeniden at">Inspiration</button>'+
       '<div class="hpbar"><i style="width:'+pct+'%"></i></div>'+
       '<div class="hp-ctl"><label for="hpv" hidden>Miktar</label><input id="hpv" type="number" min="0" inputmode="numeric" placeholder="5">'+
       '<button class="btn" data-hp="dmg">Hasar</button><button class="btn" data-hp="heal">İyileş</button><button class="btn" data-hp="temp">Temp HP</button>'+
       '<button class="btn" data-hp="long" title="Long Rest: HP ve büyü slotları dolar">Long Rest</button></div></div>';
    if(S.hp<=0){
      h+='<div style="margin-top:8px"><b>Death Saves</b> · başarı '+S.ds.s+'/3 · başarısızlık '+S.ds.f+'/3 <button class="btn" id="dsroll">Death Save at</button></div>';
    }
    h+='</section>';
    // vitals
    h+='<section class="box"><h2>Savaş</h2><div class="vitals">'+
       '<div class="vital"><b>'+c.ac+'</b><small>AC</small></div>'+
       '<button class="vital" data-roll="init"><b>'+sgn(c.initiative)+'</b><small>Initiative</small></button>'+
       '<div class="vital"><b>'+c.hiz+'</b><small>Speed ft</small></div>'+
       '<div class="vital"><b>'+sgn(c.prof_bonus)+'</b><small>Prof.</small></div>'+
       '<div class="vital"><b>'+c.pasif_perception+'</b><small>Pasif Perc.</small></div>'+
       '</div>'+(c.duyular&&Object.keys(c.duyular).length?'<p class="feat" style="margin-top:8px"><small>'+Object.keys(c.duyular).map(function(k){return esc(k)+' '+c.duyular[k]+' ft';}).join(' · ')+'</small></p>':'')+'</section>';
    // yetenekler
    h+='<section class="box"><h2>Yetenekler ve Saving Throw</h2><div class="abil">';
    Object.keys(AB).forEach(function(a){
      var y=c.yetenekler[a], s=c.saves[a];
      h+='<div class="ab"><div class="nm">'+a.toUpperCase()+'</div>'+
         '<button data-roll="chk-'+a+'" title="'+AB[a]+' check"><div class="md">'+sgn(y.mod)+'</div><div class="sc">'+y.puan+'</div></button>'+
         '<button class="sv'+(s.prof?' prof':'')+'" data-roll="sv-'+a+'" title="'+AB[a]+' saving throw">Save '+sgn(s.bonus)+'</button></div>';
    });
    h+='</div></section>';
    // skills
    h+='<section class="box"><h2>Skills</h2><ul class="rows">';
    c.skills.forEach(function(s,i){
      h+='<li><button data-roll="sk-'+i+'"><span class="dot p'+s.prof+'" title="'+(s.prof===2?'Expertise':s.prof?'Proficient':'')+'"></span><span>'+esc(s.ad)+'<span class="ab-tag">'+s.yetenek.toUpperCase()+'</span></span><span class="num">'+sgn(s.bonus)+'</span></button></li>';
    });
    h+='</ul></section>';
    // saldırılar
    h+='<section class="box span2"><h2>Saldırılar</h2>';
    if(!c.saldirilar.length) h+='<p class="feat">Silah yok.</p>';
    c.saldirilar.forEach(function(a,i){
      h+='<div class="atk"><span class="n">'+esc(a.ad)+(a.kusanili?'':' <small style="font-weight:400;color:var(--muted)">(çantada)</small>')+'</span>'+
         '<button class="btn" data-roll="atk-'+i+'" title="Attack roll">'+sgn(a.isabet)+' isabet</button>'+
         '<span style="display:flex;gap:4px"><button class="btn" data-roll="dmg-'+i+'">'+esc(a.hasar)+'</button><button class="btn" data-roll="crit-'+i+'" title="Kritik hasar">×2</button></span>'+
         '<span class="meta">'+esc(a.tur)+' · '+esc(a.menzil)+(a.ozellikler.length?' · '+a.ozellikler.map(esc).join(', '):'')+(a.mastery?' · <span class="kw" title="Weapon Mastery: bu silahta ustalığın varsa">'+esc(a.mastery)+'</span>':'')+'</span></div>';
    });
    h+='</section>';
    // büyü
    if(c.buyu){
      var b=c.buyu;
      h+='<section class="box span2"><h2>Büyü · '+esc(b.sinif)+'</h2>'+
         '<div class="vitals" style="margin-bottom:10px"><div class="vital"><b>'+b.save_dc+'</b><small>Save DC</small></div>'+
         '<button class="vital" data-roll="spatk"><b>'+sgn(b.isabet)+'</b><small>Spell atk</small></button></div>';
      if(b.slotlar.length){
        h+='<div class="slots">';
        b.slotlar.forEach(function(n,li){
          var lv=li+1, used=(S.slots[lv]||0);
          h+='<span><b class="num" style="font-size:13px">Sv '+lv+'</b> ';
          for(var k=0;k<n;k++) h+='<label><input type="checkbox" data-slot="'+lv+'" data-k="'+k+'" '+(k<used?'checked':'')+' aria-label="Seviye '+lv+' slot '+(k+1)+'"></label>';
          h+='</span>';
        });
        h+='</div>';
      }
      var byLv={}; b.buyuler.forEach(function(s){ (byLv[s.seviye]=byLv[s.seviye]||[]).push(s); });
      Object.keys(byLv).sort().forEach(function(lv){
        h+='<p class="spl"><b>'+(lv==='0'?'Cantrip':'Sv '+lv)+'</b>'+byLv[lv].map(function(s){ return esc(s.ad)+(s.konsantrasyon?' <span class="kw" title="Concentration">C</span>':'')+(s.ritual?' <span class="kw" title="Ritual">R</span>':''); }).join(', ')+'</p>';
      });
      h+='</section>';
    }
    // condition'lar
    h+='<section class="box span2"><h2>Condition\'lar</h2><div class="tags conds">'+
       CONDS.map(function(n){ return '<button class="btn'+(S.conds.indexOf(n)>-1?' on':'')+'" data-cond="'+n+'">'+n+'</button>'; }).join('')+'</div></section>';
    // özellikler ve envanter
    h+='<section class="box"><h2>Özellikler</h2>'+c.ozellikler.map(function(f){ return '<p class="feat">'+esc(f.ad)+' <small>'+esc(f.kaynak)+(f.seviye>1?' · Sv '+f.seviye:'')+'</small></p>'; }).join('')+
       (c.featler.length?'<p class="feat"><b>Feat:</b> '+c.featler.map(esc).join(', ')+'</p>':'')+
       (c.diller.length?'<p class="feat"><b>Diller:</b> '+c.diller.map(esc).join(', ')+'</p>':'')+'</section>';
    var p=c.para||{};
    h+='<section class="box"><h2>Envanter</h2><p class="feat num">'+['pp','gp','ep','sp','cp'].filter(function(k){return p[k];}).map(function(k){return p[k]+' '+k;}).join(' · ')+'</p>'+
       c.envanter.map(function(i){ return '<p class="feat">'+(i.adet>1?i.adet+'× ':'')+esc(i.ad)+(i.kusanili?' <small>(kuşanılı)</small>':'')+'</p>'; }).join('')+'</section>';
    h+='</div>';
    root.innerHTML=h;
    document.getElementById('foot').innerHTML='Beyond\'dan son çekim: '+esc(c.guncellendi)+' · <a href="'+esc(c.beyond_url)+'" target="_blank" rel="noopener">D&amp;D Beyond\'da aç</a> · HP, slot ve condition\'lar şimdilik bu tarayıcıda saklanır.';
  }

  // --- etkileşim
  root.addEventListener('click', function(e){
    var t=e.target.closest('[data-roll],[data-hp],[data-cond],#insp,#dsroll'); if(!t) return;
    var r=t.getAttribute('data-roll');
    if(r){
      if(r==='init') d20('Initiative', C.initiative);
      else if(r==='spatk') d20('Spell attack', C.buyu.isabet, true);
      else if(r.indexOf('chk-')===0){ var a=r.slice(4); d20(AB[a]+' check', C.yetenekler[a].mod); }
      else if(r.indexOf('sv-')===0){ var a2=r.slice(3); d20(AB[a2]+' save', C.saves[a2].bonus); }
      else if(r.indexOf('sk-')===0){ var s=C.skills[+r.slice(3)]; d20(s.ad, s.bonus); }
      else if(r.indexOf('atk-')===0){ var at=C.saldirilar[+r.slice(4)]; d20(at.ad+' attack', at.isabet, true); }
      else if(r.indexOf('dmg-')===0){ var ad=C.saldirilar[+r.slice(4)]; dmg(ad.ad+' hasar', ad.hasar, false); }
      else if(r.indexOf('crit-')===0){ var ac=C.saldirilar[+r.slice(5)]; dmg(ac.ad+' hasar', ac.hasar, true); }
      return;
    }
    var hp=t.getAttribute('data-hp');
    if(hp){
      var v=Math.max(0, parseInt(document.getElementById('hpv').value,10)||0);
      if(hp==='dmg'){ var rest=v; if(S.temp){ var used=Math.min(S.temp,rest); S.temp-=used; rest-=used; } S.hp=Math.max(0,S.hp-rest); }
      if(hp==='heal'){ S.hp=Math.min(C.hp_max,S.hp+v); if(S.hp>0) S.ds={s:0,f:0}; }
      if(hp==='temp'){ S.temp=Math.max(S.temp,v); }
      if(hp==='long'){ S.hp=C.hp_max; S.temp=0; S.slots={}; S.ds={s:0,f:0}; }
      save(); render(); return;
    }
    var cd=t.getAttribute('data-cond');
    if(cd){ var i=S.conds.indexOf(cd); if(i>-1) S.conds.splice(i,1); else S.conds.push(cd); save(); render(); return; }
    if(t.id==='insp'){ S.insp=!S.insp; save(); render(); return; }
    if(t.id==='dsroll'){
      var n=d(20);
      if(n===20){ S.hp=1; S.ds={s:0,f:0}; show('Death Save', 20, 'Doğal 20: 1 HP ile ayağa kalktın!', 'crit'); }
      else if(n===1){ S.ds.f=Math.min(3,S.ds.f+2); show('Death Save', 1, 'Doğal 1: iki başarısızlık', 'fail'); }
      else if(n>=10){ S.ds.s++; show('Death Save', n, 'Başarı'+(S.ds.s>=3?' · stabil oldun':'')); }
      else { S.ds.f++; show('Death Save', n, 'Başarısızlık'+(S.ds.f>=3?' · karakter öldü':''), 'fail'); }
      save(); render();
    }
  });
  root.addEventListener('change', function(e){
    var t=e.target; if(!t.matches('[data-slot]')) return;
    var lv=t.getAttribute('data-slot'), k=+t.getAttribute('data-k');
    S.slots[lv]= t.checked ? k+1 : k; save(); render();
  });
  document.querySelector('.mode').addEventListener('click', function(e){
    var b=e.target.closest('[data-mode]'); if(!b) return; mode=b.getAttribute('data-mode');
    [].forEach.call(this.querySelectorAll('[data-mode]'), function(x){ x.classList.toggle('on', x===b); });
  });

  // --- yükleme
  function open(id){
    fetch('../karakterler/'+id+'.json',{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(c){ C=c; S=load(c.id)||fresh(); if(S.hp>c.hp_max) S.hp=c.hp_max; render(); document.title=c.ad+' · Karakter Sayfası'; if(location.hash.slice(1)!==String(id)) history.replaceState(null,'','#'+id); })
      .catch(function(){ root.innerHTML='<p class="empty">Bu karakter yüklenemedi. D&amp;D Beyond\'da <b>Public</b> olduğundan emin ol; site saatte bir güncelleniyor.</p>'; });
  }
  fetch('../karakterler/liste.json',{cache:'no-cache'}).then(function(r){ return r.json(); }).then(function(list){
    if(!list.length){ root.innerHTML='<p class="empty">Henüz karakter yok.</p>'; return; }
    pick.innerHTML=list.map(function(k){ return '<option value="'+k.id+'">'+esc(k.ad)+(k.ornek?' (örnek)':'')+(k.oyuncu&&!k.ornek?' · '+esc(k.oyuncu):'')+'</option>'; }).join('');
    var want=location.hash.slice(1); if(!list.some(function(k){ return String(k.id)===want; })) want=String(list[0].id);
    pick.value=want; open(want);
  }).catch(function(){ root.innerHTML='<p class="empty">Karakter listesi yüklenemedi.</p>'; });
  pick.addEventListener('change', function(){ open(pick.value); });
})();
</script>
</body>
</html>
