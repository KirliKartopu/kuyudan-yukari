<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>Kuyudan Yukarı arka plan</title></head>
<body>
<script type="module">
// Her zaman çalışan arka plan:
//  - başkalarının zarlarını ve sıra değişimini bildirim olarak gösterir
//  - sağ tık menüleri (karakter bağla, sıraya ekle)
//  - GM'de: bağlı token'ların altındaki HP etiketlerini günceller
import OBR, { buildLabel } from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";
import { Alici, oku, gonder, hepsi, sil } from "../assets/handout-aktar.js";

const NS = "com.kuyudan-yukari";
const K_DURUM = NS + "/durum", K_SIRA = NS + "/sira", K_BAG = NS + "/karakter", K_ETIKET = NS + "/hp-etiket", K_NPC = NS + "/npc";
const BASE = new URL("../", import.meta.url).href; // .../kuyudan-yukari/
const YOL = new URL("../", import.meta.url).pathname; // /kuyudan-yukari/
const ICON = YOL + "owlbear/icon.svg";

OBR.onReady(async () => {
  // --- bildirimler
  const benimBaglanti = await OBR.player.getConnectionId();
  const zar3dAcik = () => { try { return localStorage.getItem("ky-zar3d") !== "0"; } catch (e) { return true; } };
  OBR.broadcast.onMessage(NS + "/zar", async ({ data, connectionId }) => {
    const r = data || {};
    const sahne = zar3dAcik() && r.zar;
    if (sahne) {
      const W = await OBR.viewport.getWidth(), H = await OBR.viewport.getHeight();
      const id = NS + "/zar-sahne";
      OBR.popover.open({
        id, url: YOL + "owlbear/zar.html#" + new URLSearchParams({ z: r.zar, t: r.sinif || "normal", s: "0", id }),
        width: Math.min(W, 900), height: Math.min(H, 600),
        anchorReference: "POSITION", anchorPosition: { left: W / 2, top: H / 2 },
        anchorOrigin: { horizontal: "CENTER", vertical: "CENTER" }, transformOrigin: { horizontal: "CENTER", vertical: "CENTER" },
        hidePaper: true,
      });
    }
    if (connectionId === benimBaglanti) return; // kendi zarımın sonucunu panel gösteriyor
    const variant = r.sinif === "crit" ? "SUCCESS" : r.sinif === "fail" ? "ERROR" : "DEFAULT";
    setTimeout(() => OBR.notification.show(`${r.kimden || "?"} · ${r.baslik}: ${r.toplam}  (${r.detay})`, variant), sahne ? 1800 : 0);
  });
  const benimId = await OBR.player.getId();
  const handoutAc = async (id) => {
    const W = await OBR.viewport.getWidth(), H = await OBR.viewport.getHeight();
    await OBR.modal.open({ id: NS + "/handout", url: YOL + "owlbear/handout.html#" + new URLSearchParams({ id }), width: Math.round(W * 0.85), height: Math.round(H * 0.88), hidePaper: true });
  };
  const benimRol = await OBR.player.getRole();
  const hedefMi = (kime) => benimRol === "GM" || kime === "hepsi" || (Array.isArray(kime) && kime.includes(benimId));
  const handoutMeta = async (id) => ((await OBR.room.getMetadata())[NS + "/handoutlar"] || []).find((x) => x.id === id);
  // Yerel görseller: parçalar gelince birleşir; göster isteği önce geldiyse tamamlanınca açılır
  const acilacak = new Set();
  Alici(OBR, (id) => {
    OBR.broadcast.sendMessage(NS + "/hazir", { id }, { destination: "LOCAL" });
    if (acilacak.has(id)) { acilacak.delete(id); handoutAc(id); }
  }, hedefMi);
  const goster = async (id) => {
    const h = await handoutMeta(id);
    if (h && h.kaynak === "yerel" && !(await oku(id))) {
      acilacak.add(id);
      setTimeout(async () => { if (acilacak.has(id) && !(await oku(id))) OBR.broadcast.sendMessage(NS + "/iste", { id }, { destination: "REMOTE" }); }, 4000);
      return;
    }
    handoutAc(id);
  };
  OBR.broadcast.onMessage(NS + "/handout", ({ data }) => {
    if (!data || !data.id) return;
    if (data.kime === "hepsi" || (Array.isArray(data.kime) && data.kime.includes(benimId))) goster(data.id);
  });
  // Görseli olmayan (geç katılan, başka cihaz) biri isterse GM yeniden gönderir
  if (benimRol === "GM") OBR.broadcast.onMessage(NS + "/iste", async ({ data }) => {
    const blob = data && data.id && await oku(data.id);
    const h = blob && await handoutMeta(data.id);
    if (blob && h) gonder(OBR, data.id, blob, h.kime);
  });
  // Silinen handout'ların görselleri tarayıcıdan da temizlensin
  OBR.room.onMetadataChange(async (m) => {
    const liste = m[NS + "/handoutlar"]; if (!Array.isArray(liste)) return;
    const idler = new Set(liste.map((x) => x.id));
    for (const k of await hepsi()) if (!idler.has(k)) sil(k);
  });
  OBR.broadcast.onMessage(NS + "/handout-ac", ({ data }) => { if (data && data.id) handoutAc(data.id); });
  OBR.broadcast.onMessage(NS + "/sira", ({ data }) => {
    if (data && data.ad) OBR.notification.show(`Sıra: ${data.ad} (tur ${data.tur})`, "INFO");
  });

  // --- sağ tık menüleri (sadece GM görür)
  const bagli = { key: ["metadata", K_BAG], value: undefined, operator: "!=" };
  const bagsiz = { key: ["metadata", K_BAG], value: undefined };
  const npcsiz = { key: ["metadata", K_NPC], value: undefined };
  const npcli = { key: ["metadata", K_NPC], value: undefined, operator: "!=" };
  await OBR.contextMenu.create({
    id: NS + "/bagla",
    icons: [{ icon: ICON, label: "Karakter bağla", filter: { roles: ["GM"], max: 1, every: [{ key: "layer", value: "CHARACTER" }, bagsiz, npcsiz] } }],
    embed: { url: YOL + "owlbear/bagla.html", height: 220 },
  });
  await OBR.contextMenu.create({
    id: NS + "/npc-bagla",
    icons: [{ icon: ICON, label: "NPC bağla", filter: { roles: ["GM"], every: [{ key: "layer", value: "CHARACTER" }, bagsiz, npcsiz] } }],
    embed: { url: YOL + "owlbear/npc-bagla.html", height: 250 },
  });
  await OBR.contextMenu.create({
    id: NS + "/npc-coz",
    icons: [{ icon: ICON, label: "NPC bağını kaldır", filter: { roles: ["GM"], every: [{ key: "layer", value: "CHARACTER" }, npcli] } }],
    onClick: async (ctx) => {
      const ids = ctx.items.map((i) => i.id);
      await OBR.scene.items.updateItems(ids, (items) => { for (const it of items) delete it.metadata[K_NPC]; });
    },
  });
  await OBR.contextMenu.create({
    id: NS + "/coz",
    icons: [{ icon: ICON, label: "Karakter bağını kaldır", filter: { roles: ["GM"], every: [{ key: "layer", value: "CHARACTER" }, bagli] } }],
    onClick: async (ctx) => {
      const ids = ctx.items.map((i) => i.id);
      await OBR.scene.items.updateItems(ids, (items) => { for (const it of items) delete it.metadata[K_BAG]; });
      const etiketler = await OBR.scene.items.getItems((i) => i.metadata[K_ETIKET] && ids.includes(i.attachedTo));
      if (etiketler.length) await OBR.scene.items.deleteItems(etiketler.map((i) => i.id));
    },
  });
  await OBR.contextMenu.create({
    id: NS + "/oyuncu-bagla",
    icons: [{ icon: ICON, label: "Karakterimi bağla", filter: { roles: ["PLAYER"], max: 1, every: [{ key: "layer", value: "CHARACTER" }, bagsiz] } }],
    onClick: async (ctx) => {
      const benimId = await OBR.player.getId();
      const sahip = (await OBR.room.getMetadata())[NS + "/sahipler"] || {};
      const mine = Object.keys(sahip).find((id) => sahip[id].oyuncu === benimId);
      if (!mine) { OBR.notification.show("Önce Kuyudan Yukarı panelinden karakterini seç.", "WARNING"); return; }
      try {
        await OBR.scene.items.updateItems(ctx.items.map((i) => i.id), (items) => { for (const it of items) it.metadata[K_BAG] = Number(mine); });
        OBR.notification.show("Token karakterine bağlandı.", "SUCCESS");
      } catch (e) { OBR.notification.show("Bu token'ı değiştirme iznin yok. GM'den bağlamasını iste.", "ERROR"); }
    },
  });
  await OBR.contextMenu.create({
    id: NS + "/sira-ekle",
    icons: [{ icon: ICON, label: "Sıraya ekle / çıkar", filter: { roles: ["GM"], every: [{ key: "layer", value: "CHARACTER" }] } }],
    onClick: async (ctx) => {
      const m = await OBR.room.getMetadata();
      const sira = m[K_SIRA] || { tur: 1, aktifId: null, liste: [] };
      for (const it of ctx.items) {
        const i = sira.liste.findIndex((x) => x.id === it.id);
        if (i > -1) sira.liste.splice(i, 1);
        else {
          const npc = it.metadata[K_NPC];
          sira.liste.push({ id: it.id, ad: it.text?.plainText || it.name || (npc && npc.ad) || "Token", karakter: it.metadata[K_BAG] || null, ini: npc ? npc.ini || 0 : 0, npc: !!npc, deger: null });
        }
      }
      await OBR.room.setMetadata({ [K_SIRA]: sira });
    },
  });

  // --- HP etiketleri: tek bir istemci yönetsin diye sadece GM
  if ((await OBR.player.getRole()) !== "GM") return;
  const gmId = await OBR.player.getId();
  const kCache = {};
  const karakter = async (id) => kCache[id] || (kCache[id] = fetch(BASE + "karakterler/" + id + ".json", { cache: "no-cache" }).then((r) => r.json()).catch(() => null));
  let calisiyor = false, tekrar = false;
  async function senkron() {
    if (calisiyor) { tekrar = true; return; }
    calisiyor = true;
    try {
      if (!(await OBR.scene.isReady())) return;
      const oda0 = await OBR.room.getMetadata();
      const durum = oda0[K_DURUM] || {};
      const sahipler = oda0[NS + "/sahipler"] || {};
      const items = await OBR.scene.items.getItems();
      const tokenlar = items.filter((i) => i.layer === "CHARACTER" && i.metadata[K_BAG]);
      const npcTokenlar = items.filter((i) => i.layer === "CHARACTER" && i.metadata[K_NPC] && !i.metadata[K_BAG]);
      const etiketler = items.filter((i) => i.metadata[K_ETIKET]);
      const ekle = [], guncelle = {}, sil = [];
      for (const t of tokenlar) {
        const c = await karakter(t.metadata[K_BAG]);
        if (!c) continue;
        const s = durum[c.id] || { hp: c.hp_max, temp: 0 };
        const metin = `HP ${s.hp}/${c.hp_max}` + (s.temp ? ` +${s.temp}` : "");
        const renk = s.hp <= 0 ? "#8A2E2E" : s.hp <= c.hp_max / 2 ? "#9A6E1C" : "#2F5D3A";
        const mevcut = etiketler.find((e) => e.attachedTo === t.id);
        if (mevcut) {
          if (mevcut.text?.plainText !== metin || mevcut.style?.backgroundColor !== renk) guncelle[mevcut.id] = { metin, renk };
        } else {
          const b = await OBR.scene.items.getItemBounds([t.id]);
          ekle.push(buildLabel().plainText(metin).backgroundColor(renk).backgroundOpacity(0.9).fillColor("#FFFFFF")
            .fontSize(14).padding(4).cornerRadius(6).pointerHeight(0)
            .position({ x: b.center.x, y: b.max.y + 4 }).attachedTo(t.id).layer("TEXT")
            .locked(true).disableHit(true).metadata({ [K_ETIKET]: true }).name("HP").build());
        }
      }
      // NPC: HP token'ın kendi verisinde; etiket gizli (visible:false = sadece GM görür)
      for (const t of npcTokenlar) {
        const n = t.metadata[K_NPC];
        const metin = `HP ${n.hp}/${n.hpMax}` + (n.temp ? ` +${n.temp}` : "");
        const renk = n.hp <= 0 ? "#8A2E2E" : n.hp <= n.hpMax / 2 ? "#9A6E1C" : "#2F5D3A";
        const mevcut = etiketler.find((e) => e.attachedTo === t.id);
        if (mevcut) {
          if (mevcut.text?.plainText !== metin || mevcut.style?.backgroundColor !== renk) guncelle[mevcut.id] = { metin, renk };
        } else {
          const b = await OBR.scene.items.getItemBounds([t.id]);
          ekle.push(buildLabel().plainText(metin).backgroundColor(renk).backgroundOpacity(0.9).fillColor("#FFFFFF")
            .fontSize(14).padding(4).cornerRadius(6).pointerHeight(0)
            .position({ x: b.center.x, y: b.max.y + 4 }).attachedTo(t.id).layer("TEXT").visible(false)
            .locked(true).disableHit(true).metadata({ [K_ETIKET]: true }).name("HP").build());
        }
      }
      for (const e of etiketler) if (!tokenlar.some((t) => t.id === e.attachedTo) && !npcTokenlar.some((t) => t.id === e.attachedTo)) sil.push(e.id);
      // haritadan silinen token'lar initiative sırasından da düşsün
      const oda = await OBR.room.getMetadata();
      const sira = oda[K_SIRA];
      if (sira && sira.liste && sira.liste.length) {
        const varOlan = new Set(items.map((i) => i.id));
        const gitmis = sira.liste.filter((x) => !varOlan.has(x.id)).map((x) => x.id);
        if (gitmis.length) {
          const i = sira.liste.findIndex((x) => x.id === sira.aktifId);
          if (sira.aktifId && gitmis.includes(sira.aktifId)) {
            const kalan = sira.liste.slice(i + 1).concat(sira.liste.slice(0, i)).find((x) => !gitmis.includes(x.id));
            sira.aktifId = kalan ? kalan.id : null;
          }
          sira.liste = sira.liste.filter((x) => !gitmis.includes(x.id));
          await OBR.room.setMetadata({ [K_SIRA]: sira });
        }
      }
      // Token sahipliği: bağlı token'ı karakterin oyuncusu hareket ettirebilsin.
      // Oda ayarında CHARACTER_OWNER_ONLY açıkken Owlbear başkalarını engeller.
      const sahipDegis = {};
      for (const t of tokenlar) {
        const istenen = (sahipler[t.metadata[K_BAG]] || {}).oyuncu || gmId;
        if (t.createdUserId !== istenen) sahipDegis[t.id] = istenen;
      }
      const sdIds = Object.keys(sahipDegis);
      if (sdIds.length) {
        try { await OBR.scene.items.updateItems(sdIds, (list) => { for (const t of list) t.createdUserId = sahipDegis[t.id]; }); }
        catch (e) { console.warn("Token sahibi değiştirilemedi:", e); }
      }
      if (ekle.length) await OBR.scene.items.addItems(ekle);
      const ids = Object.keys(guncelle);
      if (ids.length) await OBR.scene.items.updateItems(ids, (list) => {
        for (const l of list) { l.text.plainText = guncelle[l.id].metin; l.style.backgroundColor = guncelle[l.id].renk; }
      });
      if (sil.length) await OBR.scene.items.deleteItems(sil);
    } catch (e) { console.warn("HP etiketi senkronu:", e); }
    finally { calisiyor = false; if (tekrar) { tekrar = false; senkron(); } }
  }
  OBR.room.onMetadataChange(() => senkron());
  OBR.scene.items.onChange(() => senkron());
  OBR.scene.onReadyChange((hazir) => { if (hazir) senkron(); });
  senkron();
});
</script>
</body>
</html>
