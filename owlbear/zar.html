<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Zar</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  #sahne{width:100%;height:100%}
  #sonuc{position:absolute;left:50%;bottom:8%;transform:translateX(-50%) scale(.9);opacity:0;transition:opacity .25s,transform .25s;
    background:rgba(20,18,24,.82);color:#F3EAD6;border-radius:12px;padding:10px 22px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:none;max-width:90%}
  #sonuc.gor{opacity:1;transform:translateX(-50%) scale(1)}
  #sonuc .k{font-size:15px;opacity:.85}
  #sonuc .t{font-size:48px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
  #sonuc .t.crit{color:#C9B3FF} #sonuc .t.fail{color:#F0A39A}
  #sonuc .d{font-size:13px;opacity:.75;font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div id="sahne"></div>
<div id="sonuc"><div class="k" id="s-k"></div><div class="t" id="s-t"></div><div class="d" id="s-d"></div></div>
<script type="module">
// Harita üstünde şeffaf popover: zarları yuvarlar, durunca kapanır.
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";
import { zarAt } from "../assets/zar3d.js";
const p = new URLSearchParams(location.hash.slice(1));
OBR.onReady(async () => {
  const bildir = (d, v) => OBR.broadcast.sendMessage("com.kuyudan-yukari/ses", { d, v }, { destination: "LOCAL" });
  try { await zarAt(document.getElementById("sahne"), p.get("z"), p.get("t"), bildir); }
  catch (e) { console.warn("3D zar:", e); }
  if (p.get("toplam") != null) {
    document.getElementById("s-k").textContent = [p.get("kimden"), p.get("baslik")].filter(Boolean).join(" · ");
    const t = document.getElementById("s-t"); t.textContent = p.get("toplam"); t.className = "t " + (p.get("t") || "");
    document.getElementById("s-d").textContent = p.get("detay") || "";
    document.getElementById("sonuc").classList.add("gor");
  }
  setTimeout(() => OBR.popover.close(p.get("id")), 2600);
});
</script>
</body>
</html>
