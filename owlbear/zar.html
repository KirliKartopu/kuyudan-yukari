<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Zar</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}#sahne{width:100%;height:100%}</style>
</head>
<body>
<div id="sahne"></div>
<script type="module">
// Harita üstünde şeffaf popover: zarları yuvarlar, durunca kapanır.
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";
import { zarAt } from "../assets/zar3d.js";
const p = new URLSearchParams(location.hash.slice(1));
OBR.onReady(async () => {
  try { await zarAt(document.getElementById("sahne"), p.get("z"), p.get("t")); }
  catch (e) { console.warn("3D zar:", e); }
  setTimeout(() => OBR.popover.close(p.get("id")), 1300);
});
</script>
</body>
</html>
