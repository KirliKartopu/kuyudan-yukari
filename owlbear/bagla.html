<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Karakter bağla</title>
<style>
  body{margin:0;font:14px "Segoe UI",system-ui,sans-serif;color:#fff;background:transparent}
  ul{list-style:none;margin:0;padding:4px}
  button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;border-radius:6px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
  button:hover,button:focus-visible{background:rgba(255,255,255,.12);outline:none}
  img{width:26px;height:26px;border-radius:4px;object-fit:cover;background:rgba(255,255,255,.1)}
  small{opacity:.7}
  p{margin:8px;opacity:.8}
  body.light{color:#1B211E} body.light button:hover{background:rgba(0,0,0,.08)}
</style>
</head>
<body>
<ul id="l"><li><p>Yükleniyor…</p></li></ul>
<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";
const K_BAG = "com.kuyudan-yukari/karakter";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
OBR.onReady(async () => {
  if ((await OBR.theme.getTheme()).mode === "LIGHT") document.body.classList.add("light");
  const ul = document.getElementById("l");
  try {
    const list = await fetch("../karakterler/liste.json", { cache: "no-cache" }).then((r) => r.json());
    const sahip = (await OBR.room.getMetadata())["com.kuyudan-yukari/sahipler"] || {};
    if (!list.length) { ul.innerHTML = "<li><p>Henüz karakter yok.</p></li>"; return; }
    ul.innerHTML = list.map((k) =>
      `<li><button data-id="${k.id}">${k.avatar ? `<img alt="" src="${esc(k.avatar)}">` : "<img alt=\"\">"}<span>${esc(k.ad)}<br><small>${esc(k.siniflar.map((c) => c.ad + " " + c.seviye).join(" / "))}${sahip[k.id] ? " · " + esc(sahip[k.id].ad) : ""}</small></span></button></li>`).join("");
  } catch (e) { ul.innerHTML = "<li><p>Karakter listesi yüklenemedi.</p></li>"; return; }
  ul.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-id]"); if (!b) return;
    const secim = await OBR.player.getSelection();
    if (!secim || !secim.length) return;
    await OBR.scene.items.updateItems(secim, (items) => { for (const it of items) it.metadata[K_BAG] = Number(b.dataset.id); });
    await OBR.player.deselect();
  });
});
</script>
</body>
</html>
